<div class="announcement">
  <span>Thoughtful goods for the everyday</span>
  <span class="announcement-note">Free shipping on orders over $60</span>
</div>

<header class="site-header">
  <a class="wordmark" routerLink="/" aria-label="Fieldnotes Supply home">
    <span class="wordmark-mark">F</span>
    <span>FIELDNOTES <small>SUPPLY CO.</small></span>
  </a>
  <nav aria-label="Main navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Shop</a>
    <a class="cart-link" routerLink="/cart" routerLinkActive="active" aria-label="Shopping bag">
      Bag <span class="cart-count">{{ (cartCount$ | async) ?? 0 }}</span>
    </a>
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <span>FIELDNOTES SUPPLY CO.</span>
  <span>Made for slower mornings and longer days.</span>
  <span>© 2026</span>
</footer>
